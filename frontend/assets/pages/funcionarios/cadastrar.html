<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>PetCare</title>
    <link href="/assets/css/pages/tutores/cadastrar.css" media="screen" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/assets/css/global/elements.css" rel="stylesheet" type="text/css" />
</head>

<body>
    <main-header></main-header>

    <div class="main-container">
        <div class="grid-container">
            <div class="text-title">
                <h1>CADASTRAR TUTOR</h1>
            </div>

            <form autocomplete="off" id="tutorForm">
                <div class="section">
                    <div class="section-top">
                        <div>
                            <label for="nome">Nome Completo *</label>
                            <input id="nome" required type="text" placeholder="Digite o nome completo">
                        </div>
                        <div>
                            <label for="cpf">CPF *</label>
                            <input id="cpf" required type="text" placeholder="000.000.000-00">
                            <span id="cpf-error" class="error-message">CPF inválido! Por favor, verifique o número.</span>
                            <span id="cpf-duplicate-error" class="error-message">CPF já cadastrado! Este CPF já está em uso.</span>
                        </div>
                    </div>

                    <div class="section-middle">
                        <div>
                            <label for="endereco">Endereço *</label>
                            <input id="endereco" required type="text" placeholder="Digite o endereço completo">
                        </div>
                    </div>

                    <div class="section-bottom">
                        <div>
                            <label for="email">Email *</label>
                            <input id="email" required type="email" placeholder="exemplo@email.com">
                        </div>
                        <div>
                            <label for="telefone">Telefone *</label>
                            <input id="telefone" required type="tel" placeholder="(00) 00000-0000">
                            <span id="telefone-error" class="error-message">Telefone inválido! Por favor, verifique o número.</span>
                        </div>
                    </div>

                    <div class="section-buttom">
                        <div class="display-flex">
                            <div class="button">
                                <button type="submit">Gravar</button>
                            </div>
                            <div class="button">
                                <button onclick="window.location.href='/tutores/buscar'" type="button">Cancelar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="/assets/js/global/elements.js"></script>
    <script src="/assets/js/pages/index/menu.js"></script>
    <script src="/assets/js/pages/tutores/cadastrar.js"></script>
</body>

</html>

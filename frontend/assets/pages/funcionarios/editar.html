<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>PetCare</title>
    <link href="/assets/css/pages/tutores/cadastrar.css" media="screen" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/assets/css/global/elements.css" rel="stylesheet" type="text/css" />
</head>

<body>
    <main-header></main-header>
    <div class="main-container">

        <div class="grid-container">
            <div class="text-title">
                <h1>ATUALIZAR TUTOR</h1>
            </div>

            <form action="" autocomplete="off" method="post" id="tutorEditForm">

                <div class="section">
                    <div class="section-top">
                        <div>
                            <label for="name">Nome Completo *</label>
                            <input id="name" type="text" placeholder="Digite o nome completo">
                        </div>
                        <div class="display-flex">
                            <div>
                                <label for="cpf">CPF *</label>
                                <input id="cpf" type="text" placeholder="000.000.000-00">
                                <span id="cpf-error" class="error-message">CPF inválido! Por favor, verifique o número.</span>
                                <span id="cpf-duplicate-error" class="error-message">CPF já cadastrado! Este CPF já está em uso.</span>
                            </div>
                        </div>
                    </div>

                    <div class="section-middle">
                       
                        <div>
                            <label for="endereco">Endereço</label>
                            <input id="endereco" type="text">
                        </div>
                    </div>
                    <div class="section-bottom">
                        <div>
                            <label for="email">Email *</label>
                            <input id="email" type="email" placeholder="exemplo@email.com">
                        </div>
                        <div class="display-flex">
                            <div>
                                <label for="telefone">Telefone *</label>
                                <input id="telefone" type="tel" placeholder="(00) 00000-0000">
                                <span id="telefone-error" class="error-message">Telefone inválido! Por favor, verifique o número.</span>
                            </div>
                            
                        </div>

                    </div>
                    <div class="section-bottom">
                        <div class="display-flex"
                            style="justify-content: space-between; align-items: center; gap: 2rem; flex-wrap: wrap;">
                   
                            <div
                                style="display: flex; flex-direction: column; align-items: flex-start; justify-content: center;">
                                <label style="color: black; font-weight: 500; margin-bottom: 0.5rem;">
                                    Alterar Status
                                </label>
                                <button id="btn-status" style="background-color: #dc3545; color: white; padding: 0.5rem 1.2rem; border: none; border-radius: 20px; cursor: pointer; font-weight: bold;"
                                    type="button">
                                    Desativar
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="section-buttom">
                        <div class="display-flex">
                            <div class="button">
                                <button type="submit">Gravar</button>
                            </div>
                            <div class="button">
                                <button type="submit">Descartar suas alterações</button>
                            </div>
                        </div>

                    </div>
                </div>
            </form>
        </div>
    </div>
    <script src="/assets/js/global/elements.js"></script>
    <script src="/assets/js/pages/index/menu.js"></script>
    <script src="/assets/js/pages/tutores/editar_tutor.js"></script>
</body>

</html>

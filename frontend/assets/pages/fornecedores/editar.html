<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>PetCare</title>
    <link href="/assets/css/pages/veterinario/editar.css" media="screen" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/assets/css/global/elements.css" rel="stylesheet" type="text/css" />
</head>

<body>
    <main-header></main-header>

    <div class="main-container">
        <div class="grid-container">
            <div class="text-title">
                <h1>CADASTRAR VETERINÁRIO</h1>
            </div>

            <form autocomplete="off" id="vetForm">
                <div class="section">
                    <div class="section-top">
                        <div>
                            <label for="nome">Nome Completo *</label>
                            <input id="nome" required type="text">
                        </div>
                        <div>
                            <label for="crmv">CRMV *</label>
                            <input id="crmv" required type="text">
                            <span id="crmv-error" class="error-message">CRMV já cadastrado! Este CRMV já está em uso.</span>
                        </div>
                    </div>
                                

                    <div class="section-bottom">
                        <div>
                            <label for="email">Email *</label>
                            <input id="email" required type="email" placeholder="exemplo@email.com">
                        </div>
                        <div>
                            <label for="telefone">Telefone *</label>
                            <input id="telefone" required type="tel" placeholder="(00) 00000-0000">
                            <span id="telefone-error" class="error-message">Telefone inválido! Por favor, verifique o número.</span>
                        </div>
                    </div>
                    <div class="section-bottom">
                        <div class="display-flex"
                            style="justify-content: space-between; align-items: center; gap: 2rem; flex-wrap: wrap;">
                   
                            <div
                                style="display: flex; flex-direction: column; align-items: flex-start; justify-content: center;">
                                <label style="color: black; font-weight: 500; margin-bottom: 0.5rem;">
                                    Alterar Status
                                </label>
                                <button id="btn-status" style="background-color: #dc3545; color: white; padding: 0.5rem 1.2rem; border: none; border-radius: 20px; cursor: pointer; font-weight: bold;"
                                    type="button">
                                    Desativar
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="section-buttom">
                        <div class="display-flex">
                            <div class="button">
                                <button type="submit">Gravar</button>
                            </div>
                            <div class="button">
                                <button onclick="window.location.href='/veterinario/buscar'" type="button">Cancelar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        
    </div>

    <script src="/assets/js/global/elements.js"></script>
    <script src="/assets/js/pages/index/menu.js"></script>
    <script src="/assets/js/pages/veterinario/editar_veterinario.js"></script>
</body>

</html>

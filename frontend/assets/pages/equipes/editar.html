<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>PetCare</title>
    <link href="/assets/css/pages/animais/cadastrar.css" media="screen" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/assets/css/global/elements.css" rel="stylesheet" type="text/css" />
    <style>
        .section-middle {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .section-middle > div {
            flex: 1;
        }
        .section-middle input {
            width: 100%;
            padding: 0.6rem;
            border-radius: 6px;
         
        }
    </style>
</head>

<body>
    <main-header></main-header>
    <div class="main-container">

        <div class="grid-container">
            <div class="text-title">
                <h1>ATUALIZAR ANIMAL</h1>
            </div>

            <form action="" autocomplete="off" id="formAnimal" method="post">
                <div class="section">
                    <div class="section-top">
                        <div>
                            <label for="nome">Nome do Animal *</label>
                            <input id="nome" required type="text">
                        </div>
                        <div class="display-flex">
                            <div>
                                <label for="especie">Espécie *</label>
                                <input id="especie" required type="text">
                            </div>
                            <div>
                                <label for="raca">Raça</label>
                                <input id="raca" type="text">
                            </div>
                        </div>
                    </div>

                    <div class="section-middle">
                        <div>
                            <label for="data_nascimento">Data de Nascimento *</label>
                            <input id="data_nascimento" required type="date">
                        </div>
                        <div>
                            <label for="idade">Idade</label>
                            <input id="idade" readonly type="text">
                        </div>
                        <div>
                            <label for="peso">Peso (kg)</label>
                            <input id="peso" min="0" step="0.1" type="number">
                        </div>
                    </div>

                    <div class="section-bottom">
                        <div>
                            <label for="tutor">Tutor Responsável *</label>
                            <input id="tutor" readonly type="text">
                        </div>

                        <div class="display-flex" style="display: none;;">
                            <div>
                                <label for="status">Status</label>
                                <select id="status" style="width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px solid #ccc; background-color: #fff;">
                                    <option value="true">Ativo</option>
                                    <option value="false">Inativo</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="section-bottom">
                        <div class="display-flex" style="justify-content: space-between; align-items: center; gap: 2rem; flex-wrap: wrap;">
                           
                            <div style="display: flex; flex-direction: column; align-items: flex-start; justify-content: center;">
                                <label style="color: black; font-weight: 500; margin-bottom: 0.5rem;">
                                    Alterar Status
                                </label>
                                <button id="btn-status" style="background-color: #dc3545; color: white; padding: 0.5rem 1.2rem; border: none; border-radius: 20px; cursor: pointer; font-weight: bold;" type="button">
                                    Desativar
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="section-buttom">
                        <div class="display-flex">
                            <div class="button">
                                <button type="submit">Gravar</button>
                            </div>
                            <div class="button">
                                <button type="reset">Descartar alterações</button>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="/assets/js/global/elements.js"></script>
    <script src="/assets/js/pages/index/menu.js"></script>
    <script src="/assets/js/pages/animais/editar_animal.js"></script>
</body>

</html>

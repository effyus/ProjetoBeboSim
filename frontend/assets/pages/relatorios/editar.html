<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>PetCare</title>
    <link href="/assets/css/pages/agendamento/cadastrar.css" media="screen" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/assets/css/global/elements.css" rel="stylesheet" type="text/css" />
</head>

<body>
    <main-header></main-header>

    <div class="main-container">
        <div class="grid-container">
            <div class="text-title">
                <h1>EDITAR AGENDAMENTO</h1>
            </div>

            <form autocomplete="off" id="agendamentoForm">

                <div class="section">

                    <div class="section-top">
                        <div class="selects-row">
                            <div class="custom-select-wrapper">
                                <label for="veterinario">Veterinário</label>
                                <div class="custom-select">
                                    <div class="selected">Selecione um veterinário</div>
                                    <div class="options-container">
                                        <!-- Opções serão carregadas dinamicamente -->
                                    </div>
                                </div>
                            </div>

                            <div class="custom-select-wrapper">
                                <label for="animal">Animal</label>
                                <div class="custom-select">
                                    <div class="selected">Selecione um animal</div>
                                    <div class="options-container">
                                        <!-- Opções serão carregadas dinamicamente -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="section-bottom">
                        <div> 
                            <label for="data">Data</label>
                            <input id="data" type="date" required>
                        </div>

                        <div>
                            <label for="descricao">Descrição</label>
                            <textarea id="descricao" placeholder="Descreva o motivo do atendimento aqui..."
                                rows="4"></textarea>
                        </div>
                    </div>

                    <div class="section-buttom">
                        <div class="display-flex">
                            <div class="button">
                                <button type="submit">Atualizar</button>
                            </div>
                            <div class="button">
                                <button onclick="window.location.href='/agendamento/buscar'"
                                    type="button">Cancelar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="/assets/js/global/elements.js"></script>
    <script src="/assets/js/pages/index/menu.js"></script>
    <script src="/assets/js/pages/agendamento/editar_agendamento.js"></script>
</body>

</html>
